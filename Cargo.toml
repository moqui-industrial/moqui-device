[package]
name = "moqui-device"
version = "1.0.0"
edition = "2021"
license = "CC0-1.0"
publish = false

[features]
default = []
onnx = ["dep:ort"]

[dependencies]
moqui-core = { path = "../../../crates/moqui-core", default-features = false }
moqui-lib = { path = "../../../crates/moqui-lib" }
moqui-device-gateway = { path = "../moqui-device-gateway" }
tracing = "0.1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
async-trait = "0.1"
indexmap = "2"
jiff = "0.2"
rust_decimal = "1"
serde_json = { version = "1", features = ["arbitrary_precision"] }
url = "2"
base64 = "0.23"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"], optional = true }
